<!-- PORTFOLIO PAGE                                                            -->
<!-- ═══════════════════════════════════════════════════════════════════════════ -->
<main id="main-content">

  <!-- ─── PORTFOLIO HERO ───────────────────────────────────────────────────── -->
  <section class="page-hero page-hero--short parallax-section" id="portfolio-hero">
    <div class="parallax-bg-wrap">
      <div class="img-placeholder parallax-bg" data-placeholder="Portfolio hero banner photo (1920×600)"></div>
    </div>
    <div class="parallax-overlay"></div>
    <div class="container parallax-content reveal-up">
      <span class="section-eyebrow">OUR FINEST WORK</span>
      <h1 class="page-hero-title">Portfolio</h1>
      <p class="page-hero-sub">A curated collection of our most cherished captures</p>
    </div>
  </section>

  <!-- ─── FILTER TABS ──────────────────────────────────────────────────────── -->
  <section class="section section-portfolio" id="portfolio-section">
    <div class="container">
      <div class="filter-tabs reveal-up" role="tablist" aria-label="Filter portfolio by category">
        <button class="filter-tab active" role="tab" aria-selected="true" data-filter="all">All Work</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-filter="wedding">Weddings</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-filter="portrait">Portraits</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-filter="landscape">Landscape</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-filter="commercial">Commercial</button>
      </div>

      <!-- ─── MASONRY GALLERY ───────────────────────────────────────────────── -->
      <div class="masonry-gallery" id="masonry-gallery">
        
        <figure class="masonry-item" data-category="wedding" tabindex="0" role="button" aria-label="View wedding photo - Sunset Vows">
          <div class="masonry-img">
            <img src="/images/hyatt_wedding_photo.jpg" alt="Hyatt Photography" class="parallax-bg" decoding="async">
          </div>
          <figcaption class="masonry-caption">
            <span class="masonry-cat">Wedding</span>
            <h3>Sunset Vows</h3>
            <p>Gold Coast, QLD</p>
          </figcaption>
        </figure>

        <figure class="masonry-item masonry-item--tall" data-category="portrait" tabindex="0" role="button" aria-label="View portrait photo - Inner Light">
          <div class="masonry-img">
            <img src="/images/hyatt_portrait1.jpg" alt="Hyatt Photography" class="parallax-bg" decoding="async">
          </div>
          <figcaption class="masonry-caption">
            <span class="masonry-cat">Portrait</span>
            <h3>Inner Light</h3>
            <p>Studio Session</p>
          </figcaption>
        </figure>

        <figure class="masonry-item" data-category="landscape" tabindex="0" role="button" aria-label="View landscape photo - Morning Mist">

            <img src="/images/hyatt_landscape_4.jpg" alt="Hyatt Photography" class="parallax-bg" decoding="async">
          </div>
          <figcaption class="masonry-caption">
            <span class="masonry-cat">Landscape</span>
            <h3>Morning Mist</h3>
            <p>Blue Mountains, NSW</p>

        </figure>

        <figure class="masonry-item" data-category="commercial" tabindex="0" role="button" aria-label="View commercial photo - Brand Identity">
          <div class="masonry-img">
            <img src="/images/hyatt_commercial1.jpg" alt="Hyatt Photography" class="parallax-bg" loading="lazy" decoding="async">
          </div>
          <figcaption class="masonry-caption">
            <span class="masonry-cat">Commercial</span>
            <h3>Brand Identity</h3>
            <p>Sydney CBD</p>

        </figure>

        <figure class="masonry-item masonry-item--wide" data-category="wedding" tabindex="0" role="button" aria-label="View wedding photo - First Dance">

          <figcaption class="masonry-caption">

      </div>
    </div>
  </section>

  <!-- ─── LIGHTBOX ─────────────────────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">&times;</button>
    <div class="lightbox-content">
      <div class="lightbox-img" id="lightbox-img"></div>
      <div class="lightbox-info" id="lightbox-info"></div>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
  </div>

  <!-- ─── CTA ──────────────────────────────────────────────────────────────── -->
  <section class="section section-cta parallax-section" id="portfolio-cta">
    <div class="parallax-bg-wrap">
      <img src="/images/background_hyatt_portfolio.jpg" alt="Hyatt Photography" class="parallax-bg">
    </div>
    <div class="parallax-overlay"></div>
    <div class="container parallax-content">
      <div class="cta-content reveal-up">
        <span class="section-eyebrow">LIKE WHAT YOU SEE?</span>
        <h2 class="cta-title">Let's Create Your<br><em>Perfect Shoot</em></h2>
        <a href="/contact" class="btn btn-primary btn-large">Book a Session</a>
      </div>
    </div>
  </section>

</main>

<!DOCTYPE html>
<html lang="en" itemscope itemtype="https://schema.org/WebPage">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hyatt Photography">
  <meta property="og:locale" content="en_AU">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Hyatt Photography",
    "image": "{{OG_IMAGE}}",
    "url": "https://hyattphotography.au",
    "telephone": "+61-XXX-XXX-XXXX",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "AU"
    },
    "description": "{{DESCRIPTION}}",
    "priceRange": "$$",
    "openingHours": "Mo-Sa 09:00-18:00",
    "sameAs": [
      "https://www.instagram.com/hyattphotography",
      "https://www.facebook.com/hyattphotography"
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Photography Services",
      "itemListElement": [
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Wedding Photography"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Portrait Photography"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Commercial Photography"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Landscape Photography"}}
      ]
    }
  }
  </script>

  <!-- Prevent FOUC: Apply theme immediately before rendering -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  {{NAV}}
  {{BODY}}
  {{FOOTER}}
  <script src="/js/main.js"></script>
</body>
</html>
